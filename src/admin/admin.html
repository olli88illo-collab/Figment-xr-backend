<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FigmentXR Admin</title>
<style>
  :root { --bg:#101418; --panel:#1b222b; --line:#2a333d; --text:#fff; --muted:#b8bec6; --blue:#5fe1ff; --red:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0; }
  h1 span { color: var(--blue); }
  .bar { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .bar .grow { flex:1; }
  input[type=text], input[type=password], input[type=search] { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#0c1014; color:var(--text); font-size:15px; }
  button { cursor:pointer; border:0; border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; background:var(--blue); color:#00222b; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.danger { background:var(--red); color:#2a0000; }
  button:disabled { opacity:.5; cursor:default; }
  .login { max-width:360px; margin:12vh auto 0; background:var(--panel); padding:24px; border-radius:16px; }
  .login h1 { margin-bottom:16px; }
  .login label { display:block; margin:12px 0 6px; color:var(--muted); font-size:13px; }
  .login button { width:100%; margin-top:18px; }
  .err { color:var(--red); margin-top:12px; min-height:1.2em; font-size:14px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .tab.on { background:var(--blue); color:#00222b; border-color:var(--blue); }
  .row { display:flex; gap:14px; align-items:center; background:var(--panel); border-radius:14px; padding:12px; margin-bottom:10px; }
  .thumb { width:72px; height:72px; border-radius:10px; background:#26313b; flex:none; object-fit:cover; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:var(--blue); overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .info { flex:1; min-width:0; }
  .info .t { font-weight:700; font-size:16px; overflow-wrap:anywhere; }
  .info .m { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .info .d { color:#d5dae0; font-size:13px; margin-top:4px; overflow-wrap:anywhere; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:#26313b; color:var(--blue); margin-left:6px; vertical-align:middle; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:16px; }
  .box { background:var(--panel); border-radius:16px; padding:22px; max-width:420px; width:100%; }
  .box h2 { margin:0 0 8px; font-size:18px; }
  .box p { color:var(--muted); margin:0 0 14px; overflow-wrap:anywhere; }
  .box .btns { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#26313b; padding:10px 16px; border-radius:10px; }
  @media (max-width:560px) { .row { flex-wrap:wrap; } .row button { width:100%; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  var app = document.getElementById("app");
  var token = null;
  try { token = sessionStorage.getItem("figment_admin"); } catch (e) {}
  var tab = "sculptures", data = { sculptures: [], users: [] }, filter = "";

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function safeImg(src) { return typeof src === "string" && (src.indexOf("data:image/") === 0 || src.indexOf("https://") === 0) ? src : null; }
  function api(method, path, body) {
    return fetch("/api/admin" + path, {
      method: method,
      headers: Object.assign({ "Content-Type": "application/json" }, token ? { Authorization: "Bearer " + token } : {}),
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      if (r.status === 204) return null;
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401 && token && path !== "/login") { logout(); throw new Error(j.error || "Please log in again."); }
        if (!r.ok) throw new Error(j.error || ("Error " + r.status));
        return j;
      });
    });
  }
  function toast(msg) {
    var t = el("div", { class: "toast", text: msg }); document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3000);
  }
  function logout() {
    token = null; try { sessionStorage.removeItem("figment_admin"); } catch (e) {}
    renderLogin();
  }

  function renderLogin(msg) {
    app.textContent = "";
    var u = el("input", { type: "text", autocomplete: "username", id: "u" });
    var p = el("input", { type: "password", autocomplete: "current-password", id: "p" });
    var err = el("div", { class: "err", text: msg || "" });
    var btn = el("button", { text: "Log in" });
    function go() {
      btn.disabled = true; err.textContent = "";
      api("POST", "/login", { username: u.value, password: p.value }).then(function (j) {
        token = j.token; try { sessionStorage.setItem("figment_admin", token); } catch (e) {}
        load();
      }).catch(function (e) { err.textContent = e.message; btn.disabled = false; });
    }
    btn.addEventListener("click", go);
    p.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    app.appendChild(el("div", { class: "login" }, [
      el("h1", null, [document.createTextNode("Figment"), el("span", { text: "XR" }), document.createTextNode(" Admin")]),
      el("label", { text: "Username", for: "u" }), u,
      el("label", { text: "Password", for: "p" }), p,
      btn, err,
    ]));
    u.focus();
  }

  function load() {
    app.textContent = "";
    app.appendChild(el("div", { class: "empty", text: "Loading…" }));
    Promise.all([api("GET", "/sculptures"), api("GET", "/users")]).then(function (r) {
      data.sculptures = r[0]; data.users = r[1]; renderMain();
    }).catch(function (e) { if (token) { app.textContent = ""; app.appendChild(el("div", { class: "empty", text: e.message })); } });
  }

  function confirmBox(title, text, needTyped, onYes) {
    var input = needTyped ? el("input", { type: "text", placeholder: 'Type "' + needTyped + '" to confirm', autocomplete: "off" }) : null;
    var yes = el("button", { class: "danger", text: "Delete" });
    var no = el("button", { class: "ghost", text: "Cancel" });
    var m = el("div", { class: "modal" }, [el("div", { class: "box" }, [
      el("h2", { text: title }), el("p", { text: text }), input,
      el("div", { class: "btns" }, [no, yes]),
    ])]);
    if (input) { yes.disabled = true; input.addEventListener("input", function () { yes.disabled = input.value.trim().toLowerCase() !== needTyped.toLowerCase(); }); }
    no.addEventListener("click", function () { m.remove(); });
    yes.addEventListener("click", function () { yes.disabled = true; m.remove(); onYes(); });
    document.body.appendChild(m);
    if (input) input.focus();
  }

  function fmt(d) { try { return d ? new Date(d).toLocaleDateString() : "—"; } catch (e) { return "—"; } }

  function renderMain() {
    app.textContent = "";
    var search = el("input", { type: "search", placeholder: "Search…", value: filter });
    search.addEventListener("input", function () { filter = search.value; renderList(); });
    function tabBtn(id, label) {
      return el("button", { class: "tab" + (tab === id ? " on" : ""), text: label, onclick: function () { tab = id; filter = ""; renderMain(); } });
    }
    app.appendChild(el("div", { class: "bar" }, [
      el("h1", null, [document.createTextNode("Figment"), el("span", { text: "XR" }), document.createTextNode(" Admin")]),
      el("div", { class: "grow" }),
      el("button", { class: "ghost", text: "Refresh", onclick: load }),
      el("button", { class: "ghost", text: "Log out", onclick: logout }),
    ]));
    app.appendChild(el("div", { class: "tabs" }, [
      tabBtn("sculptures", "Installations (" + data.sculptures.length + ")"),
      tabBtn("users", "Users (" + data.users.length + ")"),
    ]));
    app.appendChild(el("div", { style: "margin-bottom:14px" }, [search]));
    app.appendChild(el("div", { id: "list" }));
    renderList();
  }

  function renderList() {
    var list = document.getElementById("list"); if (!list) return;
    list.textContent = "";
    var q = filter.trim().toLowerCase();
    var rows = tab === "sculptures" ? data.sculptures : data.users;
    rows = rows.filter(function (r) { return !q || JSON.stringify([r.name, r.owner, r.city, r.state, r.desc, r.username, r.bio, r.email, r.orgName, r.level]).toLowerCase().indexOf(q) >= 0; });
    if (!rows.length) { list.appendChild(el("div", { class: "empty", text: "Nothing here." })); return; }
    rows.forEach(function (r) {
      if (tab === "sculptures") {
        var img = safeImg(r.photo);
        list.appendChild(el("div", { class: "row" }, [
          el("div", { class: "thumb" }, [img ? el("img", { src: img, alt: "" }) : document.createTextNode((r.name || "?").charAt(0).toUpperCase())]),
          el("div", { class: "info" }, [
            el("div", { class: "t" }, [document.createTextNode(r.name || "(no name)"), r.forSale ? el("span", { class: "pill", text: "for sale" }) : null]),
            el("div", { class: "m", text: "@" + (r.owner || "unknown") + " · " + [r.city, r.state].filter(Boolean).join(", ") + " · " + fmt(r.createdAt) }),
            el("div", { class: "m", text: (typeof r.lat === "number" ? r.lat.toFixed(5) : "?") + ", " + (typeof r.lon === "number" ? r.lon.toFixed(5) : "?") }),
            r.desc ? el("div", { class: "d", text: r.desc }) : null,
          ]),
          el("button", { class: "danger", text: "Delete", onclick: function () {
            confirmBox("Delete this installation?", "“" + (r.name || "") + "” by @" + r.owner + " will be removed for everyone. This cannot be undone.", null, function () {
              api("DELETE", "/sculptures/" + encodeURIComponent(r.id)).then(function () {
                data.sculptures = data.sculptures.filter(function (x) { return x.id !== r.id; });
                data.users.forEach(function (u) { if (u.username === r.owner && u.installations > 0) u.installations--; });
                toast("Installation deleted"); renderMain();
              }).catch(function (e) { toast(e.message); });
            });
          } }),
        ]));
      } else {
        var av = safeImg(r.avatar);
        list.appendChild(el("div", { class: "row" }, [
          el("div", { class: "thumb" }, [av ? el("img", { src: av, alt: "" }) : document.createTextNode((r.username || "?").charAt(0).toUpperCase())]),
          el("div", { class: "info" }, [
            el("div", { class: "t" }, [document.createTextNode("@" + r.username), el("span", { class: "pill", text: r.level }), r.paymentStatus === "pending" ? el("span", { class: "pill", text: "payment pending" }) : null, r.isPro ? el("span", { class: "pill", text: "pro" }) : null]),
            el("div", { class: "m", text: [r.email, r.orgName, r.website].filter(Boolean).join(" · ") }),
            el("div", { class: "m", text: "Joined " + fmt(r.joined) + " · " + r.installations + " installation" + (r.installations === 1 ? "" : "s") }),
            r.bio ? el("div", { class: "d", text: r.bio }) : null,
          ]),
          el("button", { class: "danger", text: "Delete user", onclick: function () {
            confirmBox("Delete @" + r.username + "?",
              "This removes the account and all " + r.installations + " of their installations. They are logged out immediately. This cannot be undone.",
              r.username, function () {
                api("DELETE", "/users/" + encodeURIComponent(r.username)).then(function (j) {
                  data.users = data.users.filter(function (x) { return x.username !== r.username; });
                  data.sculptures = data.sculptures.filter(function (x) { return x.owner !== r.username; });
                  toast("User deleted (" + (j && j.deletedInstallations || 0) + " installations removed)"); renderMain();
                }).catch(function (e) { toast(e.message); });
              });
          } }),
        ]));
      }
    });
  }

  if (token) load(); else renderLogin();
})();
</script>
</body>
</html>
